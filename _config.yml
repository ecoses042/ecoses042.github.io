title: Minsoo Song
description: Minsoo Song's academic homepage
url: "https://ecoses042.github.io"
baseurl: ""

markdown: kramdown

sass:
    style: compressed
    sass_dir: _sass

nav:
  - name: "CV"
    link: "/Minsoo_Song_CV.pdf"
  - name: "NLP LAB"
    link: "https://sites.google.com/view/ssu-nlp/home"

footer: false
footer_url: "https://github.com/ankitsultana/researcher"
footer_text: "Page design by Ankit Sultana"

# Repo docs and build files that must not be rendered by Jekyll.
# CLAUDE.md contains literal Liquid tags and breaks the Pages build if processed.
exclude:
  - CLAUDE.md
  - README.md
  - THIRD_PARTY_LICENSES.md
  - LICENSE
  - cv.tex
  - Dockerfile
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - _vendor
